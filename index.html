<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>満員御礼プロモーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 劇場の「司令室」。上に資金・順位バー、その下に1年52週のタイムライン、左に進行中の公演カード、右に選んだ公演の客席と宣伝、最下部に「1週進める」。単一のダークな劇場テーマ。 */
:root{
  --velvet:#150c1b; --velvet-2:#21132a; --velvet-3:#2e1b3a; --line:#47304f;
  --curtain:#b02a4c; --curtain-deep:#6e1530;
  --brass:#e9b64f; --brass-soft:#f6d68c; --brass-dim:#8a6727;
  --fire:#ff6a2b; --fire-hot:#ffd23f;
  --spot:#fff2d2; --ink:#f4eaf3; --mute:#b9a6bd; --faint:#7c6884;
  --good:#5fd3a5; --bad:#ff7a7a; --cool:#86c8ff;
  --seat-off:#3a2745; --seat-on:#e9b64f;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--velvet);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden;
  background-image:radial-gradient(1200px 500px at 50% -120px,rgba(233,182,79,.12),transparent 70%),radial-gradient(900px 600px at 50% 120%,rgba(176,42,76,.16),transparent 70%)}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
main.wrap{flex:1;min-height:0;overflow:auto;width:100%}
.in2{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;min-height:100%;display:flex;flex-direction:column;gap:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
h2{font-size:clamp(18px,2.1vw,22px);line-height:1.3}
h3{font-size:15px}
p{margin:0}
.lead{color:var(--mute);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--brass);font-weight:700;white-space:nowrap}
.ic{width:18px;height:18px;flex:none;vertical-align:middle}
.ic.fill{fill:currentColor;stroke:none}

/* top bar */
.topbar{flex:none;background:rgba(21,12,27,.94);border-bottom:1px solid var(--brass-dim)}
.topbar .in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;display:flex;gap:16px;align-items:center}
.brand{font-family:var(--f-display);font-size:16px;color:var(--brass);letter-spacing:.06em;margin-right:auto;white-space:nowrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:10px;color:var(--mute);letter-spacing:.08em;white-space:nowrap}
.stat b{font-family:var(--f-num);font-size:15px;font-weight:600;white-space:nowrap}
.stat.rank b{font-family:var(--f-display);font-weight:400;color:var(--fire-hot);display:flex;align-items:center;gap:4px}
.bar4{width:64px;height:4px;background:var(--seat-off);border-radius:3px;overflow:hidden;margin-top:2px}
.bar4 i{display:block;height:100%;background:var(--brass)}
.iconbtn{appearance:none;background:var(--velvet-3);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{border-color:var(--brass)}
.btn{appearance:none;border:1px solid var(--line);background:var(--velvet-3);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--brass);background:#3a2348}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--brass-soft),var(--brass));color:#2a1606;border-color:var(--brass)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#fff0bf,var(--brass-soft))}
.btn.fire{background:linear-gradient(180deg,var(--fire-hot),var(--fire));color:#2a0a02;border-color:var(--fire);box-shadow:0 0 22px rgba(255,106,43,.45)}
.btn.fire:hover:not(:disabled){background:linear-gradient(180deg,#fff08a,var(--fire-hot))}
.btn.big{padding:11px 22px;font-size:15px;border-radius:10px}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tip{border-left:3px solid var(--brass);background:rgba(233,182,79,.07);padding:7px 11px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink)}
.tip b{color:var(--brass-soft)}
.muted{color:var(--mute)}
.good{color:var(--good)} .bad{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{border-color:var(--brass-dim);color:var(--brass-soft)}
.chip.ok{border-color:rgba(95,211,165,.5);color:var(--good)}
.chip.ng{border-color:rgba(255,122,122,.5);color:var(--bad)}
.chip .ic{width:12px;height:12px}
.term{border:0;border-bottom:1px dotted var(--brass);cursor:help;color:var(--brass-soft);background:none;padding:0;font:inherit}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(52,minmax(14px,1fr));gap:2px;overflow-x:auto;padding-bottom:2px}
.tw{height:30px;border-radius:4px;background:var(--velvet-2);position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:var(--faint);font-family:var(--f-num)}
.tw.past{opacity:.35}
.tw.now{background:var(--brass);color:#2a1606;font-weight:700}
.tw .m{position:absolute;top:1px;left:2px;font-size:9px;color:var(--mute)}
.tw.now .m{color:#2a1606}
.tw .dot{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;border:2px solid var(--velvet)}

/* hub */
.hub{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:10px;flex:1;min-height:0}
@media (max-width:860px){.hub{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:8px;min-height:0}
@media (max-width:860px){.plist .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}}
.cards{display:flex;flex-direction:column;gap:8px}
.pcard{position:relative;text-align:left;border:1px solid var(--line);background:var(--velvet-2);border-radius:12px;padding:0;cursor:pointer;overflow:visible;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--brass)}
.pcard.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset,0 0 24px rgba(233,182,79,.18)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px 5px 6px;background:linear-gradient(110deg,var(--c1),var(--c2));border-radius:11px 11px 0 0}
.pc-name{font-family:var(--f-display);font-size:15px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-cd{font-family:var(--f-display);font-size:13px;color:#fff;background:rgba(0,0,0,.4);border-radius:99px;padding:1px 9px;white-space:nowrap}
.pc-body{display:flex;gap:10px;align-items:center;padding:7px 10px 8px}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px}
.pc-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;font-size:12px}
.pc-info .sold{font-family:var(--f-num);font-size:12px;color:var(--mute)}
.pc-info .sold b{font-size:17px;color:var(--brass-soft)}
.heat{height:7px;border-radius:5px;background:var(--seat-off);overflow:hidden;position:relative}
.heat i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--curtain),var(--fire),var(--fire-hot))}
.pc-icons{display:flex;gap:4px;flex-wrap:wrap}
.pcard.empty{align-items:center;justify-content:center;min-height:86px;border-style:dashed;color:var(--brass-soft);font-weight:700;gap:2px;padding:10px}
.pcard.empty small{font-weight:400;color:var(--mute);font-size:11px}
.pcard.locked{cursor:default;opacity:.5;border-style:dashed;align-items:center;justify-content:center;min-height:56px;font-size:12px;color:var(--mute)}
.pop{position:absolute;right:12px;bottom:26px;font-family:var(--f-display);color:var(--good);font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;animation:popup 1.6s ease-out forwards;z-index:3}
@keyframes popup{0%{transform:translateY(8px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.stampmini{position:absolute;right:10px;bottom:8px;font-family:var(--f-display);font-size:13px;color:var(--curtain);border:2px solid var(--curtain);border-radius:6px;padding:0 6px;transform:rotate(-8deg);background:rgba(21,12,27,.8)}
.news{list-style:none;margin:0;padding:0;font-size:12px;overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px}
.news li{padding:4px 8px;border-radius:6px;background:var(--velvet-3);border-left:3px solid var(--line)}
.news li.ev{border-left-color:var(--curtain)} .news li.gd{border-left-color:var(--good)} .news li.rv{border-left-color:var(--cool)}

.detail{display:flex;flex-direction:column;gap:8px;min-height:0}
.dhead{border-radius:12px;padding:6px 12px 6px 8px;min-height:58px;background:linear-gradient(110deg,var(--c1),var(--c2));display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.dhead::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px);pointer-events:none}
.dhead>*{position:relative;z-index:1}
.dhead .an{font-family:var(--f-display);font-size:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.dhead .chip{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.3);color:#fff}
.dhead .cd{margin-left:auto;font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:8px;flex:1;min-height:0}
@media (max-width:1000px){.dgrid{grid-template-columns:1fr}}
.seatbox{background:#120a17;border:1px solid var(--line);border-radius:12px;padding:6px 8px;position:relative}
.seatbox svg{width:100%;height:auto;display:block;max-height:calc(100dvh - 420px);min-height:150px;margin:0 auto}
.soldout{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-family:var(--f-display);font-size:clamp(24px,3vw,34px);color:#ffdfe7;border:4px double #ffdfe7;padding:2px 14px;border-radius:8px;background:rgba(176,42,76,.85);letter-spacing:.1em;pointer-events:none}
.chart svg{width:100%;height:auto;display:block}
.flamebox{display:flex;gap:10px;align-items:center}
.flameic{width:40px;height:40px;color:var(--fire);filter:drop-shadow(0 0 8px rgba(255,106,43,.6));animation:flick 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
.heatbig{height:14px;border-radius:8px;background:var(--seat-off);overflow:hidden;position:relative}
.heatbig i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--curtain),var(--fire),var(--fire-hot));transition:width .6s}
.heatbig::after{content:"";position:absolute;top:0;bottom:0;left:62.5%;width:2px;background:rgba(255,255,255,.35)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;gap:0 8px;align-items:center;text-align:left;background:var(--velvet-3);border:1px solid var(--line);border-radius:10px;padding:6px 9px;cursor:pointer;min-width:0}
.tile:hover:not(:disabled){border-color:var(--fire);box-shadow:0 0 14px rgba(255,106,43,.25)}
.tile:disabled{opacity:.38;cursor:not-allowed}
.tile .ti{grid-row:1/3;width:34px;height:34px;border-radius:9px;background:var(--velvet);display:flex;align-items:center;justify-content:center;color:var(--brass-soft)}
.tile .ti .ic{width:20px;height:20px}
.tile b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tc{font-family:var(--f-num);font-size:11.5px;color:var(--brass-soft);white-space:nowrap}
.tile .pips{display:flex;gap:1px;color:var(--fire)}
.tile .pips .ic{width:13px;height:13px}
.tile .pips .off{color:var(--seat-off)}
.tile .fit{font-size:11px;color:var(--mute);white-space:nowrap}
.tile.done{border-style:dashed}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.flow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.flow span{display:flex;align-items:center;gap:4px;font-size:12px;background:var(--velvet-3);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.flow span i{font-style:normal;font-family:var(--f-num);color:var(--brass)}

/* footer */
.actionbar{flex:none;border-top:1px solid var(--brass-dim);background:rgba(21,12,27,.96)}
.actionbar .in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.apdots{display:flex;gap:5px}
.apdots i{width:14px;height:14px;border-radius:50%;background:var(--seat-off);border:1px solid var(--brass-dim)}
.apdots i.on{background:radial-gradient(circle at 40% 35%,var(--fire-hot),var(--fire));border-color:var(--fire);box-shadow:0 0 10px var(--fire)}
.hint{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* plan */
.phead{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.phead .ttl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.phead .ttl .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phead .nav{display:flex;gap:8px;margin-left:auto}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--velvet-2);border:1px solid var(--line);color:var(--faint);white-space:nowrap}
.stepper span.on{color:#2a1606;background:var(--brass);border-color:var(--brass);font-weight:700}
.stepper span.done{color:var(--brass-soft);border-color:var(--brass-dim)}
.grid-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.grid-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acard{position:relative;text-align:left;background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.acard:hover:not(.locked){border-color:var(--brass);transform:translateY(-2px)}
.acard.locked{cursor:not-allowed}
.acard.locked>*{opacity:.42}
.acard.locked .lock{opacity:1}
.poster{height:96px;padding:8px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 55%)}
.poster>*:not(.art){position:relative;z-index:1}
.poster .pn{font-family:var(--f-display);font-size:19px;line-height:1.1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.poster .pk{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.8)}
.poster .ptype{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.3);color:#fff}
.acard .body{padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.desc{font-size:12px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kv4{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 8px;font-size:12px;margin:0}
.kv4 dt{color:var(--mute);white-space:nowrap} .kv4 dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.lock{position:absolute;top:8px;right:8px;z-index:3;font-size:11px;font-weight:700;background:var(--velvet);border:1px solid var(--bad);color:var(--bad);border-radius:99px;padding:1px 9px}
.stars{color:var(--brass);letter-spacing:1px}
.stars i{color:var(--seat-off);font-style:normal}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:900px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vcard{text-align:left;background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.vcard:hover:not(.locked){border-color:var(--brass)}
.vcard.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.vcard.locked{opacity:.45;cursor:not-allowed}
.vcard .chip{align-self:flex-start}
.vcard .vn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .cap{font-family:var(--f-display);font-size:19px;color:var(--brass-soft);line-height:1.1}
.vcard .vm{font-size:11px;color:var(--mute);font-family:var(--f-num)}
.fitbar{height:6px;border-radius:4px;background:var(--seat-off);position:relative;overflow:hidden}
.fitbar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.fitlab{font-size:11px;line-height:1.3}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.cal{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
table.cal th,table.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 3px;text-align:center}
table.cal tr:last-child>*{border-bottom:0}
table.cal th{color:var(--mute);font-weight:500;background:var(--velvet-2)}
table.cal th.rowh{text-align:left;padding-left:10px;white-space:nowrap}
.slot{width:100%;min-height:38px;border-radius:6px;border:1px dashed transparent;background:none;cursor:default;font-size:11px;color:var(--faint);line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot small{font-family:var(--f-num);font-size:10px;font-weight:500;opacity:.85}
.slot.ok{cursor:pointer;background:rgba(95,211,165,.1);border-color:rgba(95,211,165,.45);color:var(--good);font-weight:700}
.slot.ok:hover{background:rgba(95,211,165,.22)}
.slot.sel{background:var(--brass);color:#2a1606;border-color:var(--brass)}
.slot.na{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.035) 5px 10px)}
.slot.rival{color:var(--cool);font-weight:700}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{text-align:left;background:var(--velvet-3);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.opt:hover{border-color:var(--brass)}
.opt.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.opt b{font-size:13px}
.opt span{font-size:12px;color:var(--mute);line-height:1.4}

const SND={ctx:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  tone(f,d,type='square',v=.05,at=0,slide=0){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+at;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);},
  noise(d,v,freq,type='lowpass',at=0){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+at;const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.25,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t);},

  boom(){this.noise(.7,.5,180);this.tone(90,.5,'sine',.35,0,40);},

const FX={cv:null,ctx:null,ps:[],run:false,
  reduce:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,
  setup(){this.cv=$('#fx');if(!this.cv)return;this.ctx=this.cv.getContext('2d');const r=()=>{const d=Math.min(2,devicePixelRatio||1);this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.ctx.setTransform(d,0,0,d,0,0);};r();addEventListener('resize',r);},
  add(p){if(this.reduce||!this.ctx)return;this.ps.push(p);if(!this.run){this.run=true;requestAnimationFrame(t=>this.loop(t));}},
  confetti(n=140){const cols=['#e9b64f','#ff6fa3','#7cc7ff','#b98cff','#fff2d2','#ff6a2b'];for(let i=0;i<n;i++)this.add({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:rnd(-1,1),vy:rnd(2,5),g:.04,life:220,col:cols[i%6],s:rnd(4,8),rot:Math.random()*6,vr:rnd(-.2,.2),k:'c'});},
  fire(x,y,n=70){for(let i=0;i<n;i++)this.add({x:x+rnd(-14,14),y,vx:rnd(-1.6,1.6),vy:rnd(-9,-4),g:.12,life:rnd(40,70),col:Math.random()<.5?'#ffd23f':'#ff6a2b',s:rnd(3,7),k:'f'});},
  spark(x,y,n=40){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rnd(2,7);this.add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.08,life:rnd(30,55),col:'#fff2d2',s:rnd(2,4),k:'f'});}},
  loop(){const c=this.ctx;c.clearRect(0,0,innerWidth,innerHeight);
    this.ps=this.ps.filter(p=>{p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;
      if(p.k==='c'){p.rot+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();}
      else{c.globalAlpha=Math.max(0,p.life/60);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.s*Math.max(.2,p.life/70),0,7);c.fill();c.globalAlpha=1;}
      return p.life>0&&p.y<innerHeight+40;});
    if(this.ps.length)requestAnimationFrame(t=>this.loop(t));else{this.run=false;c.clearRect(0,0,innerWidth,innerHeight);}}
};

function genSched(){
  const sc={a:{},v:{}};
  const mk=p=>{const o={};for(let w=1;w<=SEASON+4;w++)for(const d of['wd','we'])o[w+'-'+d]=Math.random()<p?'f':'b';return o;};
  ARTISTS.forEach(a=>sc.a[a.id]=mk(a.avail));
  VENUES.forEach(v=>sc.v[v.id]=mk(v.avail));
  S.sched=sc;
}
function slotDate(w,d){const base=new Date(2027,0,4);return new Date(base.getTime()+((w-1)*7+(d==='we'?5:2))*86400000);}
function fmtDate(dt){return `${dt.getMonth()+1}/${dt.getDate()}(${'日月火水木金土'[dt.getDay()]})`;}

/* ========== 需要モデル ========== */
function priceFactor(a,price){const r=a.ref/price;return r>=1?Math.min(1.6,Math.pow(r,a.el)):Math.max(0.15,Math.pow(r,a.el*1.8));}
function dayFactor(a,d){return d==='we'?1:(a.genre==='classical'?0.9:0.78);}
function leadFactor(L){return 0.85+0.025*L;}
function repFactor(){return 0.9+S.rep/400;}
function demand(p,aw,extra=1){const a=A(p.artist);return baseOf(a)*aw*priceFactor(a,p.price)*dayFactor(a,p.d)*leadFactor(p.L)*repFactor()*extra;}
function curve(k,K){return k>=K?0.85:0.28+0.57*Math.pow(k/K,1.6);}
function loanLimit(){return Math.round((1000000+S.rep*S.rep*8000)/100000)*100000;}
function loanUsed(){return S.projects.reduce((s,p)=>s+p.loan,0);}
function upfront(p){const a=A(p.artist),v=Vn(p.venue),g=GRADES[p.grade];const rent=v.rent[p.d==='we'?1:0];const prod=Math.round(v.prod*g.mult);const art=p.deal==='fixed'?a.fee:Math.round(a.fee*0.3);return{rent,prod,art,total:rent+prod+art};}
function insCost(p){return Math.round(upfront(p).total*0.03/1000)*1000;}
function sponsorAmt(p){const a=A(p.artist),v=Vn(p.venue);return Math.round(Math.min(v.cap,baseOf(a))*350/10000)*10000;}
function investAmt(p){return Math.round(upfront(p).total*0.4/10000)*10000;}
function breakEven(p){const a=A(p.artist),v=Vn(p.venue),u=upfront(p);const fixed=u.rent+u.prod+(p.deal==='fixed'?a.fee:0)+v.cap*150;const per=p.price*0.92-400-(p.deal==='share'?p.price*a.share:0);return per>0?Math.ceil(fixed/per):Infinity;}
function pricePenalty(a,price){return Math.max(0,(price/a.ref-1.15)*50);}
function assets(){return S.cash-S.projects.reduce((s,p)=>s+p.loan+p.investAmt-p.sunk,0);}
function ranking(){const l=S.rivals.map(r=>({name:r.name,v:r.cash,c:r.c,me:false}));l.push({name:'あなたの会社',v:assets(),c:'#e9b64f',me:true});l.sort((x,y)=>y.v-x.v);return l;}
function myRank(){return ranking().findIndex(x=>x.me)+1;}

  const app=$('#app');
  if(!S){app.innerHTML=titleHTML();lastKey='';return;}
  const key=S.phase+'|'+(S.plan?S.plan.step:'')+'|'+S.week;
  const m0=document.querySelector('main.wrap');const st=(m0&&key===lastKey)?m0.scrollTop:0;
  let body='',foot='';
  if(S.phase==='hub'){body=hubHTML();foot=footHTML();}
  else if(S.phase==='plan') body=planHTML();
  else if(S.phase==='show') body=showHTML();
  else if(S.phase==='result') body=resultHTML();
  else if(S.phase==='end') body=endHTML();
  app.innerHTML=topbarHTML()+`<main class="wrap"><div class="in2">${body}</div></main>`+foot;
  document.querySelector('main.wrap').scrollTop=st;lastKey=key;
  if(S.phase==='plan'&&S.plan.step===3) updateForecast();
  if(S.phase==='plan'&&S.plan.step===4) updateFunding();
  save();
}

  let h='';for(let w=1;w<=SEASON;w++){const dt=slotDate(w,'wd');const p=marks[w];
    const mlab=(w===1||dt.getDate()<=7)?`<span class="m">${dt.getMonth()+1}月</span>`:'';

  return `<div class="timeline" aria-label="1年間のタイムライン">${h}</div>`;
}

/* ----- 宣伝・週送り ----- */
function scaleAdj(p){return clamp(Math.pow(1000/baseOf(A(p.artist)),0.4),0.3,1.6);}
function promoGain(p,pr){return pr.eff*pr.fit[A(p.artist).genre]*scaleAdj(p)*Math.max(0,1.6-p.aw)/1.1;}
function mediaChance(){return clamp(0.3+S.rep/150,0.3,0.85);}
function doPromo(pid,id){
  const p=proj(pid),pr=PROMOS.find(x=>x.id===id);if(!p||p.used[id]||S.ap<=0||S.cash<pr.cost)return;
  let g=promoGain(p,pr)*rnd(0.7,1.3),msg='';
  if(pr.vary){const m=rnd(0.3,2.2);g=promoGain(p,pr)*m;msg=m>1.5?'大当たり！拡散された':m<0.7?'反応いまひとつ…':'';}
  if(pr.chance){if(Math.random()<mediaChance())msg='売り込み成功！';else{g=0;msg='今回は不採用…';}}
  S.cash-=pr.cost;p.promoSpent+=pr.cost;p.sunk+=pr.cost;S.ap--;p.used[id]=true;p.aw=Math.min(1.6,p.aw+g);
  render();
  const el=document.querySelector(`.tile[onclick*="'${id}'"]`);const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  if(g>0){FX.fire(r.left+r.width/2,r.top+10,g>0.1?60:30);SND.tone(440,.12,'sawtooth',.04,0,880);}else SND.miss();
  toast(`${ic(pr.icon)} ${pr.name}：熱量 +${Math.round(g*100)}% ${msg}`,g>0.1?'fire':'');
}
function advanceWeek(){
  if(S.phase!=='hub'||modalQ.length||$('#modal-root').innerHTML||(S.showQueue&&S.showQueue.length))return;
  SND.click();
  S.week++;

}

function computeShow(p,bonus){

  let walk=Math.max(0,Math.round((D-p.sold)*p.walkinMod));walk=Math.min(walk,v.cap-p.sold);
  const presold=p.sold,sold=p.sold+walk,fill=sold/v.cap,attend=Math.round(sold*(1-p.noShow));
  let sat=62+g.sat+v.fit[a.genre]+p.satMod+bonus-pricePenalty(a,p.price)+rnd(-5,5);
  if(fill>=0.95)sat+=10;else if(fill>=0.8)sat+=5;else if(fill<0.3)sat-=18;else if(fill<0.5)sat-=10;
  sat=clamp(Math.round(sat),5,100);

    return{id:m.id,name:m.name,q,dem,sold:s,rev:s*m.price,unsold:q-s,salv:Math.round((q-s)*m.cost*0.4),lost:Math.max(0,dem-q)*(m.price-m.cost)};});
  const merchRev=merch.reduce((s,x)=>s+x.rev,0),salvage=merch.reduce((s,x)=>s+x.salv,0);
  const ticketRev=sold*p.price,playguide=Math.round(presold*p.price*0.08),staff=v.cap*150+sold*400;
  const sharePay=Math.max(Math.round(a.fee*0.3),Math.round(ticketRev*a.share));
  const artistPay=p.deal==='fixed'?a.fee:sharePay,altPay=p.deal==='fixed'?sharePay:a.fee;
  const refund=p.sponsorAmt&&fill<0.7?Math.round(p.sponsorAmt*0.5):0;
  const gift=Math.round(p.crowd*0.35),interest=Math.round(p.loan*0.05);
  const P0=ticketRev+merchRev+salvage+p.sponsorAmt-refund+p.crowd-gift+p.eventIncome-playguide-staff-artistPay-p.rentPaid-p.prodPaid-p.promoSpent-p.eventCost-p.merchCost-interest-p.insCost;
  const invShare=p.investAmt?Math.round(P0*0.4):0,invPayout=p.investAmt?Math.max(0,p.investAmt+invShare):0;
  S.cash+=ticketRev+merchRev+salvage-playguide-staff-(artistPay-p.artistPaid)-refund-gift-(p.loan+interest)-invPayout;
  const net=P0-(invPayout-p.investAmt);
  let dRep=fill>=0.999?6:fill>=0.9?5:fill>=0.75?3:fill>=0.5?0:-6;

  if(dRep>0)dRep=Math.max(1,Math.round(dRep*(1-S.rep/180)));

const seatCache={};
function seatLayout(n){

  const cx=210,cy=16,a0=35*Math.PI/180,a1=145*Math.PI/180,rows=[];for(let r=62;r<=258;r+=14)rows.push(r);
  const totalLen=rows.reduce((s,r)=>s+r*(a1-a0),0),sp=totalLen/n,pts=[];
  rows.forEach((r,ri)=>{const cnt=Math.max(1,Math.round(r*(a1-a0)/sp));for(let i=0;i<cnt;i++){const t=a0+(a1-a0)*(i+0.5)/cnt;pts.push({x:cx+r*Math.cos(t),y:cy+r*Math.sin(t),ri,c:Math.abs(t-Math.PI/2)});}});

}

  let cum=0;const cums=p.weekly.map(x=>cum+=x);const maxY=v.cap,bw=iw/K,y=val=>pt+ih-(val/maxY)*ih;
  const bars=p.weekly.map((n,i)=>`<rect x="${(pl+i*bw+bw*0.18).toFixed(1)}" y="${y(n).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${(pt+ih-y(n)).toFixed(1)}" rx="2" fill="var(--curtain)"/>`).join('');
  const line=cums.length?`<polyline fill="none" stroke="var(--brass)" stroke-width="2" points="${cums.map((c,i)=>`${(pl+(i+0.5)*bw).toFixed(1)},${y(c).toFixed(1)}`).join(' ')}"/>`+cums.map((c,i)=>`<circle cx="${(pl+(i+0.5)*bw).toFixed(1)}" cy="${y(c).toFixed(1)}" r="${i===cums.length-1?4:2.5}" fill="var(--brass)"/>`).join(''):'';
  const ticks=[0,0.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(maxY*f)}" y2="${y(maxY*f)}" stroke="var(--line)" ${f===1?'stroke-dasharray="4 3"':''}/><text x="${pl-6}" y="${y(maxY*f)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${fmtN(maxY*f)}</text>`).join('');
  const xl=Array.from({length:K},(_,i)=>(K<=8||i%2===0)?`<text x="${(pl+(i+0.5)*bw).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mute)">${i+1}週</text>`:'').join('');
  const empty=!p.weekly.length?`<text x="${pl+iw/2}" y="${pt+ih/2}" text-anchor="middle" font-size="12" fill="var(--faint)">来週チケット発売！</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="週ごとの販売枚数">${ticks}${bars}${line}${xl}${empty}<text x="${W-pr}" y="${pt-3}" text-anchor="end" font-size="10" fill="var(--mute)">点線＝キャパ　━ 累計　■ その週</text></svg>`;
}

/* ========== モーダル ========== */
function showModal(html,wide){$('#modal-root').innerHTML=`<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal ${wide?'wide':''}">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
function closeInfo(){closeModal();if(S&&S.phase==='hub')runQueue();}
function term(name){
  const g=GLOSSARY.find(x=>x[0]===name||x[0].startsWith(name));if(!g)return;
  if($('#modal-root').innerHTML){const box=document.createElement('div');box.className='tip';box.style.marginTop='10px';box.innerHTML=`<b>${g[0]}：</b>${g[1]}`;$('.modal').appendChild(box);return;}
  showModal(`<div class="eyebrow">用語手帳</div><h3>${g[0]}</h3><p class="lead">${g[1]}</p><div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeInfo()">閉じる</button></div>`);
}
function openGlossary(){showModal(`<div class="eyebrow">プロモーターの用語手帳</div><h3>知っておきたい業界用語</h3><dl class="gl">${GLOSSARY.map(g=>`<div><dt>${g[0]}</dt><dd>${g[1]}</dd></div>`).join('')}</dl><div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeInfo()">閉じる</button></div>`,true);}
function openHowTo(){
  showModal(`<div class="eyebrow">遊び方</div><h3>1年で業界No.1を目指せ</h3>
  <div class="stack" style="margin-top:6px">
   <div class="tip"><b>企画する：</b>演者・会場・日程・契約・資金を決めて公演を立ち上げる（行動力1）。人気の演者はライバルに日程を取られていく。</div>
   <div class="tip"><b>同時進行：</b>公演は2本（信頼度40で3本）まで並行できる。行動力は毎週3。どの公演の宣伝に使うかが勝負。</div>
   <div class="tip"><b>宣伝で熱量を上げる：</b>炎の数が効果の大きさ。演者のファン層に合う媒体（相性◎）を選ぼう。</div>
   <div class="tip"><b>本番：</b>白い線が炎のゾーンに入った瞬間に「点火！」。演出が決まるほど満足度・グッズ・評判が上がる。</div>
   <div class="tip"><b>勝利条件：</b>52週後の資産で、ライバル3社と順位を競う。資金がマイナスになると倒産。</div>
  </div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeInfo()">わかった</button></div>`,true);
}
function openMenu(){
  showModal(`<h3>メニュー</h3><div class="stack" style="margin-top:10px">
   <button class="choice" onclick="closeModal();openHowTo()"><b>遊び方</b></button>
   <button class="choice" onclick="closeModal();S.phase==='show'&&MG&&(MG.locked=true);S=null;render()"><b>タイトルに戻る</b><span>進行状況は自動でセーブされています</span></button>
   <button class="choice" onclick="closeInfo()"><b>閉じる</b></button></div>`);
}

/* ========== 起動 ========== */
function start(data){FX.setup();if(data&&data.S){S=data.S;SND.on=S.sound!==false;}render();if(S)resumeFlow();}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
