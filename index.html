<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>満員御礼プロモーター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 劇場の客席から見たステージ。上部に資金バー、左に「チケット半券＋客席図」、右に「プロモーターの机（行動）」。単一のダークな劇場テーマ。 */
:root{
  --velvet:#150c1b; --velvet-2:#21132a; --velvet-3:#2e1b3a; --line:#47304f;
  --curtain:#b02a4c; --curtain-deep:#6e1530;
  --brass:#e9b64f; --brass-soft:#f6d68c; --brass-dim:#8a6727;
  --spot:#fff2d2; --ink:#f4eaf3; --mute:#b9a6bd; --faint:#7c6884;
  --good:#5fd3a5; --bad:#ff7a7a; --cool:#86c8ff;
  --seat-off:#3a2745; --seat-on:#e9b64f;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--velvet);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:radial-gradient(1200px 500px at 50% -120px,rgba(233,182,79,.13),transparent 70%),radial-gradient(900px 600px at 50% 120%,rgba(176,42,76,.16),transparent 70%);
  background-attachment:fixed}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
h2{font-size:clamp(22px,3.2vw,30px);line-height:1.3}
h3{font-size:17px}
p{margin:0}
.lead{color:var(--mute);max-width:65ch}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--brass);font-weight:700}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--velvet)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(21,12,27,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--brass-dim)}
.topbar .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:18px;color:var(--brass);letter-spacing:.06em;margin-right:auto}
.stat{display:flex;flex-direction:column;line-height:1.2}
.stat small{font-size:11px;color:var(--mute);letter-spacing:.08em}
.stat b{font-family:var(--f-num);font-size:16px;font-weight:600}
.repbar{width:70px;height:5px;background:var(--seat-off);border-radius:3px;overflow:hidden;margin-top:3px}
.repbar i{display:block;height:100%;background:var(--brass)}
.btn{appearance:none;border:1px solid var(--line);background:var(--velvet-3);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:transform .12s,background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--brass);background:#3a2348}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--brass-soft),var(--brass));color:#2a1606;border-color:var(--brass)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#fff0bf,var(--brass-soft))}
.btn.big{padding:14px 26px;font-size:17px;border-radius:10px}
.btn.sm{padding:6px 11px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* panels */
.panel{background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;padding:18px}
.tip{border-left:3px solid var(--brass);background:rgba(233,182,79,.07);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.tip b{color:var(--brass-soft)}
.muted{color:var(--mute)}
.good{color:var(--good)} .bad{color:var(--bad)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{border-color:var(--brass-dim);color:var(--brass-soft)}
.chip.ok{border-color:rgba(95,211,165,.5);color:var(--good)}
.chip.ng{border-color:rgba(255,122,122,.5);color:var(--bad)}
.term{border-bottom:1px dotted var(--brass);cursor:help;color:var(--brass-soft);background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit}

/* stepper */
.stepper{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.stepper span{font-size:13px;padding:5px 12px;border-radius:99px;background:var(--velvet-2);border:1px solid var(--line);color:var(--faint)}
.stepper span.on{color:#2a1606;background:var(--brass);border-color:var(--brass);font-weight:700}
.stepper span.done{color:var(--brass-soft);border-color:var(--brass-dim)}

/* artist cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.acard{position:relative;text-align:left;background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.acard:hover:not(.locked){border-color:var(--brass);transform:translateY(-2px)}
.acard.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.acard.locked{cursor:not-allowed}
.poster{height:118px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}
.poster .pn{font-family:var(--f-display);font-size:24px;line-height:1.1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);position:relative;z-index:1}
.poster .pk{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.8);position:relative;z-index:1}
.acard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lockveil{position:absolute;inset:0;background:rgba(21,12,27,.9);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:700;color:var(--mute);z-index:2}
.stars{color:var(--brass);letter-spacing:2px}
.stars i{color:var(--seat-off);font-style:normal}

/* venues */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.vcard{text-align:left;background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.vcard:hover:not(.locked){border-color:var(--brass)}
.vcard.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.vcard.locked{opacity:.45;cursor:not-allowed}
.vcard .chip{align-self:flex-start}
.vcard .cap{font-family:var(--f-display);font-size:22px;color:var(--brass-soft)}
.fitbar{height:8px;border-radius:4px;background:var(--seat-off);position:relative;overflow:hidden}
.fitbar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.cal-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table.cal{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
table.cal th,table.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 4px;text-align:center}
table.cal th{color:var(--mute);font-weight:500;background:var(--velvet-2)}
table.cal th.rowh{text-align:left;padding-left:10px;white-space:nowrap}
.slot{width:100%;min-height:42px;border-radius:6px;border:1px dashed transparent;background:none;cursor:default;font-size:11px;color:var(--faint);line-height:1.25}
.slot.ok{cursor:pointer;background:rgba(95,211,165,.1);border-color:rgba(95,211,165,.45);color:var(--good);font-weight:700}
.slot.ok:hover{background:rgba(95,211,165,.22)}
.slot.sel{background:var(--brass);color:#2a1606;border-color:var(--brass)}
.slot.na{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.035) 5px 10px)}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.opt{text-align:left;background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--brass)}
.opt.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.opt b{font-size:15px}
.opt span{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
input[type=range]{width:100%;accent-color:var(--brass)}
.bigval{font-family:var(--f-num);font-size:28px;font-weight:600;color:var(--brass-soft)}
.frow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.frow:last-child{border-bottom:0}
.frow .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.frow.total{border-top:1px solid var(--brass-dim);border-bottom:0;font-weight:700;padding-top:10px;margin-top:4px}
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.toggle:hover{border-color:var(--brass)}
.toggle.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.toggle .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--brass-dim);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#2a1606}
.toggle.on .box{background:var(--brass);border-color:var(--brass)}
.toggle .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle .t span{font-size:13px;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:10px}

/* campaign */
.camp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.camp{grid-template-columns:1fr}}
.stub{display:grid;grid-template-columns:110px 1fr;background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.stub .side{background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--f-display);color:#fff;font-size:20px;letter-spacing:.1em;border-right:2px dashed rgba(255,255,255,.35);padding:10px}
.stub .info{padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stub .info .t1{font-family:var(--f-display);font-size:20px}
.countdown{font-family:var(--f-display);color:var(--brass-soft);font-size:26px;line-height:1}
.seatbox{background:#120a17;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;position:relative}
.seatbox svg{width:100%;height:auto;display:block}
.soldout{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-family:var(--f-display);font-size:clamp(26px,5vw,42px);color:var(--curtain);border:4px solid var(--curtain);padding:4px 18px;border-radius:8px;background:rgba(18,10,23,.75);letter-spacing:.1em;pointer-events:none}
.meter{height:12px;border-radius:6px;background:var(--seat-off);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--curtain),var(--brass));border-radius:6px;transition:width .5s}
.apdots{display:flex;gap:6px}
.apdots i{width:14px;height:14px;border-radius:50%;background:var(--seat-off);border:1px solid var(--brass-dim)}
.apdots i.on{background:var(--brass);box-shadow:0 0 8px var(--brass)}
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.promo{text-align:left;background:var(--velvet-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:13px}
.promo:hover:not(:disabled){border-color:var(--brass)}
.promo:disabled{opacity:.4;cursor:not-allowed}
.promo b{font-size:14px}
.promo .gain{font-family:var(--f-num);color:var(--good)}
.promo .cost{font-family:var(--f-num);color:var(--brass-soft)}
.promo.used{opacity:.55;border-style:dashed}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log li{padding:6px 10px;border-radius:6px;background:var(--velvet-3)}
.log li.ev{border-left:3px solid var(--curtain)}
.log li.gd{border-left:3px solid var(--good)}
.chart svg{width:100%;height:auto;display:block}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,4,10,.78);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
.modal{background:var(--velvet-2);border:1px solid var(--brass-dim);border-radius:14px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{max-width:820px}
.modal h3{font-size:22px;margin-bottom:8px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--velvet-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--brass)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice span{font-size:13px;color:var(--mute)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mitem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.mitem:last-child{border-bottom:0}
.gl dt{font-weight:700;color:var(--brass-soft);margin-top:12px}
.gl dd{margin:2px 0 0;color:var(--ink);font-size:14px}

/* title */
.title-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding-block:40px}
.curtain{position:absolute;top:0;bottom:0;width:16vw;max-width:200px;background:repeating-linear-gradient(90deg,var(--curtain-deep) 0 14px,var(--curtain) 14px 30px,var(--curtain-deep) 30px 40px);box-shadow:inset -20px 0 40px rgba(0,0,0,.5)}
.curtain.l{left:0;border-radius:0 0 60% 0}
.curtain.r{right:0;transform:scaleX(-1);border-radius:0 0 60% 0}
.beam{position:absolute;top:-10%;width:34vw;height:130%;background:linear-gradient(180deg,rgba(255,242,210,.22),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;animation:sweep 7s ease-in-out infinite alternate}
.beam.b1{left:12%;animation-delay:-2s}
.beam.b2{right:12%;animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.title-card{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px}
.logo{font-family:var(--f-display);font-size:clamp(54px,12vw,120px);line-height:1;background:linear-gradient(180deg,#fff6dc 10%,var(--brass) 60%,#a8741f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(233,182,79,.35));letter-spacing:.04em}
.logo-sub{font-family:var(--f-display);font-size:clamp(16px,3vw,22px);letter-spacing:.3em;color:var(--spot)}
.marquee{display:flex;gap:10px;justify-content:center}
.marquee i{width:9px;height:9px;border-radius:50%;background:var(--brass);animation:blink 1.2s infinite}
.marquee i:nth-child(2n){animation-delay:.6s}
@keyframes blink{50%{opacity:.25}}

/* show scene */
.stage-scene{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#3b1f2c,#100812 70%);border:1px solid var(--brass-dim);padding:18px 18px 10px}
.stage-scene .beam{width:40%;opacity:.8;animation-duration:3.2s}
.stage-scene svg{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;height:auto;display:block}
.seat-live{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.counter{background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.counter small{color:var(--mute);font-size:12px;letter-spacing:.08em}
.counter b{display:block;font-family:var(--f-num);font-size:24px;font-weight:600;color:var(--brass-soft)}
.stamp{position:absolute;z-index:3;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(1);font-family:var(--f-display);font-size:clamp(34px,8vw,72px);color:#ffdfe7;border:6px double #ffdfe7;padding:6px 26px;border-radius:12px;background:rgba(176,42,76,.82);letter-spacing:.12em;animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:2.4s;white-space:nowrap}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-8deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}}

/* result */
.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl td{padding:6px 4px;border-bottom:1px dashed var(--line)}
.pl td.v{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl tr.h td{color:var(--brass);font-weight:700;border-bottom:1px solid var(--brass-dim);padding-top:14px;letter-spacing:.08em;font-size:12px}
.pl tr.sum td{font-weight:700;border-bottom:0;border-top:1px solid var(--brass-dim);font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--velvet-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{color:var(--mute);font-size:12px}
.kpi b{display:block;font-family:var(--f-num);font-size:22px;font-weight:600}
.lessons{display:flex;flex-direction:column;gap:10px}
.hist{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.hist th,.hist td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.hist td.v{text-align:right;font-family:var(--f-num)}
.rank{font-family:var(--f-display);font-size:clamp(60px,14vw,120px);line-height:1;color:var(--brass)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div id="app"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ========== ユーティリティ ========== */
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmtN=n=>Math.round(n).toLocaleString('ja-JP');
function fmtY(n){
  const neg=n<0; n=Math.abs(Math.round(n)); let s;
  if(n>=100000000) s=(n/100000000).toFixed(2).replace(/\.?0+$/,'')+'億円';
  else if(n>=10000) s=(Math.round(n/1000)/10).toLocaleString('ja-JP')+'万円';
  else s=n.toLocaleString('ja-JP')+'円';
  return (neg?'−':'')+s;
}

function slotKeys(){const k=[];for(let w=4;w<=12;w++)for(const d of['wd','we'])k.push(w+'-'+d);return k;}
function genAvail(){
  const keys=slotKeys(); const av={a:{},v:{}};
  const pick=(p,min)=>{let s=keys.filter(()=>Math.random()<p);while(s.length<min){const x=keys[Math.floor(Math.random()*keys.length)];if(!s.includes(x))s.push(x);}return s;};
  ARTISTS.forEach(a=>av.a[a.id]=pick(a.avail,3));
  VENUES.forEach(v=>av.v[v.id]=pick(v.avail,4));
  ARTISTS.forEach(a=>{
    let n=VENUES.filter(v=>av.v[v.id].some(k=>av.a[a.id].includes(k))).length;
    let guard=0;
    while(n<2&&guard++<20){const v=VENUES[Math.floor(Math.random()*VENUES.length)];const k=av.v[v.id][Math.floor(Math.random()*av.v[v.id].length)];if(!av.a[a.id].includes(k))av.a[a.id].push(k);n=VENUES.filter(v=>av.v[v.id].some(k=>av.a[a.id].includes(k))).length;}
  });
  S.avail=av;
}
function slotDate(w,d){
  const base=new Date(2027,0,4); // 月曜
  const dt=new Date(base.getTime()+((S.absWeek+w)*7+(d==='we'?5:2))*86400000);
  return dt;
}
function fmtDate(dt){return `${dt.getMonth()+1}/${dt.getDate()}(${'日月火水木金土'[dt.getDay()]})`;}
function fmtDateLong(dt){return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日(${'日月火水木金土'[dt.getDay()]})`;}
function parseSlot(k){const [w,d]=k.split('-');return{w:+w,d};}

/* ========== 需要モデル ========== */
function priceFactor(a,price){return clamp(Math.pow(a.ref/price,a.el),0.2,1.8);}
function dayFactor(a,d){return d==='we'?1:(a.genre==='classical'?0.9:0.78);}
function leadFactor(w){return 0.85+0.025*w;}
function repFactor(){return 0.9+S.rep/400;}
function demand(p,aw,extra=1){
  const a=A(p.artist),sl=parseSlot(p.slot);
  return baseOf(a)*aw*priceFactor(a,p.price)*dayFactor(a,sl.d)*leadFactor(sl.w)*repFactor()*extra;
}
function curve(k,K){return k>=K?0.85:0.28+0.57*Math.pow(k/K,1.6);}
function loanLimit(){return Math.round((1000000+S.rep*S.rep*8000)/100000)*100000;}
function upfront(p){
  const a=A(p.artist),v=Vn(p.venue),sl=parseSlot(p.slot),g=GRADES[p.grade];
  const rent=v.rent[sl.d==='we'?1:0];
  const prod=Math.round(v.prod*g.mult);
  const art=p.deal==='fixed'?a.fee:Math.round(a.fee*0.3);
  return{rent,prod,art,total:rent+prod+art};
}
function sponsorAmt(p){const a=A(p.artist),v=Vn(p.venue);return Math.round(Math.min(v.cap,baseOf(a))*350/10000)*10000;}
function investAmt(p){return Math.round(upfront(p).total*0.4/10000)*10000;}
function breakEven(p){
  const a=A(p.artist),v=Vn(p.venue),u=upfront(p);
  const fixed=u.rent+u.prod+(p.deal==='fixed'?a.fee:0)+v.cap*150;
  const per=p.price*(1-0.08)-400-(p.deal==='share'?p.price*0.45:0);
  return per>0?Math.ceil(fixed/per):Infinity;
}

function render(){
  const app=$('#app');
  if(!S){app.innerHTML=titleHTML();return;}
  let body='';
  if(S.phase==='plan') body=planHTML();
  else if(S.phase==='camp') body=campHTML();
  else if(S.phase==='show') body=showHTML();
  else if(S.phase==='result') body=resultHTML();
  else if(S.phase==='end') body=endHTML();
  app.innerHTML=topbarHTML()+`<main class="wrap">${body}</main>`;
  if(S.phase==='plan'&&S.plan.step===3) updateForecast();
  if(S.phase==='plan'&&S.plan.step===4) updateFunding();
  if(S.phase==='show') animateShow();
  save();
}

function togglePlan(k){S.plan[k]=!S.plan[k];render();}
function onPrice(v){S.plan.price=+v;$('#pval').textContent=fmtN(v)+'円';updateForecast();}
function onLoan(v){S.plan.loan=+v;$('#loanv').textContent=fmtY(+v);updateFunding();}
function updateForecast(){
  const p=S.plan,a=A(p.artist),v=Vn(p.venue),u=upfront(p);
  const lo=demand(p,a.aw0),hi=demand(p,1.15);
  const be=breakEven(p);
  const expSold=Math.min(v.cap,hi);
  const rev=expSold*p.price;
  const artPay=p.deal==='fixed'?a.fee:Math.max(a.fee*0.3,rev*0.45);

  const sl=parseSlot(p.slot);
  $('#forecast').innerHTML=`<div class="eyebrow">事前シミュレーション</div>
   <h3 style="margin:4px 0 10px">${esc(a.name)} ＠ ${esc(v.name)}</h3>

function fundingTotals(){
  const p=S.plan,u=upfront(p);
  const inflow=p.loan+(p.sponsor?sponsorAmt(p):0)+(p.investor?investAmt(p):0);
  return{u,inflow,after:S.cash+inflow-u.total};
}

function confirmPlan(){
  const p=S.plan,a=A(p.artist),t=fundingTotals();
  if(t.after<0)return;
  p.cashStart=S.cash;
  p.sponsorAmt=p.sponsor?sponsorAmt(p):0;
  p.investAmt=p.investor?investAmt(p):0;
  p.rentPaid=t.u.rent;p.prodPaid=t.u.prod;p.artistPaid=t.u.art;
  S.cash=t.after;
  const sl=parseSlot(p.slot);
  S.camp={week:0,K:sl.w,aw:a.aw0,sold:0,weekly:[],ap:3,used:{},promoSpent:0,eventCost:0,eventIncome:0,demandMod:1,merchMod:1,satMod:0,noShow:0.02,walkinMod:1,apPenalty:0,noise:rnd(0.88,1.12),merch:null,merchDone:false,log:[],soldOutWeek:0,crowd:0,seen:{}};
  const C=S.camp;
  C.log.unshift({t:`${esc(a.name)} と ${esc(Vn(p.venue).name)} を本押さえ。発売準備スタート！`,c:'gd'});
  if(p.crowd){
    const raised=Math.round(baseOf(a)*rnd(250,400)*(0.8+S.rep/100)/1000)*1000;
    C.crowd=raised;S.cash+=raised;C.aw=Math.min(1.6,C.aw+0.06);
    C.log.unshift({t:`クラウドファンディング終了：${fmtY(raised)} 集まった（話題度アップ）`,c:'gd'});
  }
  S.phase='camp';
  render();scrollTo(0,0);
}

/* ----- 宣伝・販売フェーズ ----- */
function scaleAdj(){const a=A(S.plan.artist);return clamp(Math.pow(1000/baseOf(a),0.4),0.3,1.6);}
function promoGain(pr){const a=A(S.plan.artist);return pr.eff*pr.fit[a.genre]*scaleAdj()*Math.max(0,1.6-S.camp.aw)/1.1;}
function demandNow(withNoise=true){return demand(S.plan,S.camp.aw,S.camp.demandMod*(withNoise?S.camp.noise:1));}
function campHTML(){
  const p=S.plan,C=S.camp,a=A(p.artist),v=Vn(p.venue),sl=parseSlot(p.slot);
  const remain=C.K-C.week;
  const soldOut=C.sold>=v.cap;

  return `<div class="eyebrow">第${S.showNo}公演 ／ チケット販売中</div>
  <div class="camp" style="margin-top:10px">
   <div>
    <div class="stub" style="--c1:${a.c[0]};--c2:${a.c[1]}">

      <div class="info">
        <span class="muted" style="font-size:12px">${esc(v.name)}（${fmtN(v.cap)}席）</span>
        <span class="t1">${fmtDateLong(slotDate(sl.w,sl.d))}</span>
        <div class="row" style="gap:8px"><span class="chip gold num">${fmtN(p.price)}円</span><span class="chip">${p.deal==='fixed'?'固定ギャラ':'歩合制'}</span><span class="chip">${GRADES[p.grade].name}</span></div>
        <div class="row" style="justify-content:space-between;margin-top:4px"><span class="muted" style="font-size:13px">公演まで</span><span class="countdown">あと${remain}週</span></div>
      </div>
    </div>
    <div class="seatbox">
      <div class="row" style="justify-content:space-between"><b>販売状況</b><span class="num"><b style="color:var(--brass-soft);font-size:18px">${fmtN(C.sold)}</b> / ${fmtN(v.cap)}枚（${Math.round(C.sold/v.cap*100)}%）</span></div>
      ${seatSVG(v.cap,C.sold,false)}
      ${soldOut?'<div class="soldout">SOLD OUT</div>':''}

   </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between"><b>話題度</b><span class="num">${Math.round(C.aw*100)}%</span></div>

      ${soldOut?'<p class="good" style="font-size:13px;margin-top:6px">完売しました。これ以上の宣伝はチケット売上を増やしません。</p>':''}

   </div>
  </div>`;
}
function mediaChance(){return clamp(0.3+S.rep/150,0.3,0.85);}
function doPromo(id){
  const C=S.camp,pr=PROMOS.find(x=>x.id===id);
  if(C.used[id]||C.ap<=0||S.cash<pr.cost)return;
  let g=promoGain(pr),msg;
  if(pr.vary){const m=rnd(0.4,2.1);g*=m;msg=m>1.5?'大当たり！投稿が拡散された':m<0.7?'反応はいまひとつ…':'まずまずの反応';}
  if(pr.chance){if(Math.random()<mediaChance()){msg='売り込み成功！取材記事が出た';}else{g=0;msg='今回は採用されなかった';}}
  S.cash-=pr.cost;C.promoSpent+=pr.cost;C.ap--;C.used[id]=true;
  C.aw=Math.min(1.6,C.aw+g);
  C.log.unshift({t:`${pr.name}${msg?'：'+msg:''}（話題度 +${(g*100).toFixed(1)}%）`});
  render();
}
function advanceWeek(){
  const p=S.plan,C=S.camp,v=Vn(p.venue);
  C.week++;
  const D=demandNow();
  const target=Math.min(v.cap,D*curve(C.week,C.K));
  let add=Math.max(0,Math.round(target-C.sold));add=Math.min(add,v.cap-C.sold);
  C.sold+=add;C.weekly.push(add);
  C.log.unshift({t:`${C.week===1?'一般発売！ ':''}第${C.week}週：${fmtN(add)}枚 売れた（累計 ${fmtN(C.sold)}枚）`,c:'gd'});
  if(C.sold>=v.cap&&!C.soldOutWeek){C.soldOutWeek=C.week;C.log.unshift({t:`チケット完売！（公演${C.K-C.week}週前）`,c:'gd'});}
  C.aw=Math.max(0.3,C.aw-0.03);
  C.used={};C.ap=3-C.apPenalty;C.apPenalty=0;
  if(C.week>=C.K){
    if(!C.merchDone){C.merchDone=true;C.merch={};}
    S.phase='show';computeShow();render();scrollTo(0,0);return;
  }
  if(Math.random()<0.42)queueEvent();
  if(C.K-C.week<=3&&!C.merchDone)modalQ.push(merchModal);
  render();runQueue();
}

function addAw(x){S.camp.aw=clamp(S.camp.aw+x,0.2,1.6);}
function queueEvent(){
  const pool=EVENTS.filter(e=>(!e.cond||e.cond())&&!S.camp.seen[e.id]);
  if(!pool.length)return;
  let tot=pool.reduce((s,e)=>s+e.w,0),r=Math.random()*tot,ev=pool[0];
  for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}
  S.camp.seen[ev.id]=true;
  modalQ.push(()=>eventModal(ev));
}
let curChoices=null,curEvent=null;
function eventModal(ev){
  curEvent=ev;
  if(ev.apply){
    const r=ev.apply();S.camp.log.unshift({t:`${ev.title}（${r}）`,c:'ev'});
    showModal(`<div class="eyebrow">ニュース速報</div><h3>${ev.title}</h3><p class="lead">${ev.text}</p><p style="margin-top:10px"><b class="good">${r}</b></p><div class="row" style="margin-top:16px"><button class="btn primary" onclick="closeModal();render();runQueue()">OK</button></div>`);
  } else {
    curChoices=ev.choices();
    showModal(`<div class="eyebrow">判断が必要です</div><h3>${ev.title}</h3><p class="lead">${ev.text}</p>
     <div class="stack" style="margin-top:14px">${curChoices.map((c,i)=>`<button class="choice" ${c.cost&&S.cash<c.cost?'disabled':''} onclick="pickChoice(${i})"><b>${c.label}</b><span>${c.sub}${c.cost&&S.cash<c.cost?'（資金不足）':''}</span></button>`).join('')}</div>`);
  }
}
function pickChoice(i){const c=curChoices[i];const r=c.fn();S.camp.log.unshift({t:`${curEvent.title} → ${r}`,c:'ev'});closeModal();render();runQueue();}
function runQueue(){if($('#modal-root').innerHTML)return;const f=modalQ.shift();if(f)f();}

/* ----- グッズ発注 ----- */
function merchRate(m,a){const r=(m.over&&m.over[a.genre]!=null)?m.over[a.genre]:m.rate;return r*a.merch;}
let merchOrder={};
function merchModal(){
  const p=S.plan,C=S.camp,a=A(p.artist),v=Vn(p.venue);
  const est=Math.round(Math.min(v.cap,demandNow(false)));
  merchOrder={};
  const lot=v.cap>=8000?100:v.cap>=1200?20:10;
  const rows=MERCH.map(m=>{
    const r=merchRate(m,a); const sug=Math.round(est*r/lot)*lot; const max=Math.max(lot*10,Math.ceil(est*r*2.5/lot)*lot);
    merchOrder[m.id]=0;
    return `<div class="mitem">
      <div><b>${m.name}</b><br><small class="muted">原価 ${fmtN(m.cost)}円 → 販売 ${fmtN(m.price)}円 ／ 購入率の目安 約${(r*100).toFixed(0)}%（目安 ${fmtN(sug)}個）</small></div>
      <div class="num" style="text-align:right"><b id="mq-${m.id}" style="font-size:18px;color:var(--brass-soft)">0</b>個</div>
      <input type="range" id="mr-${m.id}" min="0" max="${max}" step="${lot}" value="0" style="grid-column:1/-1" oninput="onMerch('${m.id}',this.value)" aria-label="${m.name}の発注数">
    </div>`;
  }).join('');
  showModal(`<div class="eyebrow">公演3週前 ／ 発注の締め切り</div><h3>グッズを何個つくる？</h3>
   <p class="lead">工場の製造に3週間かかるため、今が発注の締め切りです。現在 <b class="num">${fmtN(C.sold)}枚</b> 売れていて、最終的な来場は <b class="num">約${fmtN(est)}人</b> の見込み。満足度が高いほどよく売れます。</p>
   <div style="margin-top:10px">${rows}</div>
   <div class="frow total"><span>発注総額（今すぐ支払い）</span><span class="v" id="mtotal">0円</span></div>
   <p class="muted" style="font-size:13px">売れ残りは後日の通販で原価の40%しか回収できません（<button class="term" onclick="term('在庫リスクと機会損失')">在庫リスク</button>）。少なすぎると売り切れて儲けを逃します。</p>
   <div class="row" style="margin-top:14px"><button class="btn primary" id="mok" onclick="confirmMerch()">この数で発注する</button><span class="muted" id="mwarn" style="font-size:13px"></span></div>`,true);
}
function onMerch(id,v){merchOrder[id]=+v;$('#mq-'+id).textContent=fmtN(v);const t=MERCH.reduce((s,m)=>s+merchOrder[m.id]*m.cost,0);$('#mtotal').textContent=fmtY(t);const over=t>S.cash;$('#mok').disabled=over;$('#mwarn').textContent=over?'資金が足りません':'';}
function confirmMerch(){
  const t=MERCH.reduce((s,m)=>s+merchOrder[m.id]*m.cost,0);if(t>S.cash)return;
  S.cash-=t;S.camp.merch={...merchOrder};S.camp.merchCost=t;S.camp.merchDone=true;
  S.camp.log.unshift({t:t?`グッズを発注（${fmtY(t)}）`:'今回はグッズを作らないことにした',c:'gd'});
  closeModal();render();runQueue();
}

/* ----- 公演当日と精算 ----- */
function computeShow(){
  const p=S.plan,C=S.camp,a=A(p.artist),v=Vn(p.venue),g=GRADES[p.grade];
  const D=demandNow();
  let walk=Math.max(0,Math.round((D-C.sold)*C.walkinMod));walk=Math.min(walk,v.cap-C.sold);
  const presold=C.sold,sold=C.sold+walk,fill=sold/v.cap;
  const attend=Math.round(sold*(1-C.noShow));
  let sat=62+g.sat+v.fit[a.genre]+C.satMod+rnd(-6,6);
  if(fill>=0.95)sat+=10;else if(fill>=0.8)sat+=5;else if(fill<0.3)sat-=18;else if(fill<0.5)sat-=10;
  sat=clamp(Math.round(sat),10,100);
  // 物販
  const merch=MERCH.map(m=>{
    const q=(C.merch&&C.merch[m.id])||0;
    const dem=Math.round(attend*merchRate(m,a)*(sat/70)*C.merchMod*rnd(0.75,1.25));
    const s=Math.min(q,dem);
    return{name:m.name,q,dem,sold:s,rev:s*m.price,cost:q*m.cost,unsold:q-s,salv:Math.round((q-s)*m.cost*0.4),lost:Math.max(0,dem-q)*(m.price-m.cost)};
  });
  const merchRev=merch.reduce((s,x)=>s+x.rev,0),salvage=merch.reduce((s,x)=>s+x.salv,0),merchCost=C.merchCost||0;
  const ticketRev=sold*p.price;
  const playguide=Math.round(presold*p.price*0.08);
  const staff=v.cap*150+sold*400;
  const artistPay=p.deal==='fixed'?a.fee:Math.max(Math.round(a.fee*0.3),Math.round(ticketRev*0.45));
  const altPay=p.deal==='fixed'?Math.max(Math.round(a.fee*0.3),Math.round(ticketRev*0.45)):a.fee;
  const artistRemain=artistPay-p.artistPaid;
  const refund=p.sponsorAmt&&fill<0.7?Math.round(p.sponsorAmt*0.5):0;
  const gift=Math.round(C.crowd*0.35);
  const interest=Math.round(p.loan*0.05);
  const P0=ticketRev+merchRev+salvage+p.sponsorAmt-refund+C.crowd-gift+C.eventIncome-playguide-staff-artistPay-p.rentPaid-p.prodPaid-C.promoSpent-C.eventCost-merchCost-interest;
  const invShare=p.investAmt?Math.round(P0*0.4):0;
  const invPayout=p.investAmt?Math.max(0,p.investAmt+invShare):0;
  S.cash+=ticketRev+merchRev+salvage-playguide-staff-artistRemain-refund-gift-(p.loan+interest)-invPayout;
  const net=S.cash-p.cashStart;
  // 評判
  let dRep=fill>=0.999?6:fill>=0.9?5:fill>=0.75?3:fill>=0.5?0:-6;
  dRep+=Math.round((sat-65)/10);
  if(fill>=0.85)dRep+=v.tier;
  dRep+=net>0?1:-2;
  const repBefore=S.rep;
  S.rep=clamp(S.rep+dRep,0,100);
  if(fill>=0.9)S.boost[a.id]=boost(a.id)*1.12;else if(fill<0.5)S.boost[a.id]=boost(a.id)*0.95;
  const be=breakEven(p);
  S.result={presold,walk,sold,fill,attend,sat,merch,merchRev,salvage,merchCost,ticketRev,playguide,staff,artistPay,altPay,refund,gift,interest,P0,invShare,invPayout,net,dRep,repBefore,be,
    rent:p.rentPaid,prod:p.prodPaid,promo:C.promoSpent,eventCost:C.eventCost,eventIncome:C.eventIncome,sponsor:p.sponsorAmt,crowd:C.crowd,soldOutWeek:C.soldOutWeek,K:C.K,cap:v.cap,price:p.price,est:D};
  S.history.push({no:S.showNo,artist:a.name,venue:v.name,cap:v.cap,sold,fill,sat,net,price:p.price});
}
function showHTML(){
  const p=S.plan,a=A(p.artist),v=Vn(p.venue),R=S.result;
  const full=R.fill>=0.999;
  return `<div class="eyebrow">第${S.showNo}公演 ／ 公演当日</div>
  <h2 style="margin:6px 0 12px">${esc(a.name)} LIVE ＠ ${esc(v.name)}</h2>
  <div class="stage-scene">
    <div class="beam b1"></div><div class="beam b2"></div>

function sceneLine(R){
  if(R.fill>=0.999)return'開演前から会場は熱気でいっぱい。最高の夜になった。';
  if(R.fill>=0.8)return'たくさんのお客さんが集まり、会場は大盛り上がり。';
  if(R.fill>=0.5)return'後方に空席はあるが、前方のファンは熱く盛り上がった。';
  return'空席が目立ち、演者もどこか寂しそうだった…。';
}
function animateShow(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,suf=el.dataset.suffix||'',yen=el.dataset.yen;const t0=performance.now(),dur=2200;
    const step=t=>{const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);const v=to*e;el.textContent=(yen?fmtY(v):fmtN(v))+suf;if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function goResult(){S.phase='result';render();scrollTo(0,0);}
function lessons(R){
  const p=S.plan,a=A(p.artist),v=Vn(p.venue),L=[];
  if(R.soldOutWeek&&R.K-R.soldOutWeek>=3){const extra=Math.round(R.est-R.cap);L.push(`<b>機会損失：</b>公演の${R.K-R.soldOutWeek}週も前に完売しました。需要はキャパを約${fmtN(Math.max(0,extra))}枚上回っていた計算です。もう少し高い価格か、大きい会場でもよかったかもしれません。`);}
  if(R.fill<0.6)L.push(`<b>会場が大きすぎた？：</b>稼働率${Math.round(R.fill*100)}%。演者の動員力に対してキャパが大きいと、空席が評判を下げます。会場選びか宣伝量を見直しましょう。`);
  if(R.fill<0.999&&R.fill>=0.6&&R.promo<R.ticketRev*0.05)L.push(`<b>あと一押し：</b>空席が残りました。宣伝費は売上の${Math.round(R.promo/Math.max(1,R.ticketRev)*100)}%。もう少し宣伝すれば満席に届いたかもしれません。`);
  if(R.promo>R.ticketRev*0.3)L.push(`<b>宣伝費のかけすぎ：</b>宣伝費がチケット売上の${Math.round(R.promo/R.ticketRev*100)}%に達しました。話題度が高くなるほど効果は小さくなります（収穫逓減）。`);
  const lost=R.merch.reduce((s,x)=>s+x.lost,0),unsold=R.merch.reduce((s,x)=>s+x.unsold,0),ord=R.merch.reduce((s,x)=>s+x.q,0);
  if(ord===0&&a.merch>=0.5)L.push(`<b>物販なし：</b>グッズを作らなかったため、売れたはずの利益（推定${fmtY(R.merch.reduce((s,x)=>s+x.lost,0))}）を逃しました。`);
  else{
    if(lost>Math.max(30000,R.merchRev*0.15))L.push(`<b>グッズの売り切れ：</b>品切れで約${fmtY(lost)}の利益を逃しました（機会損失）。人気の高い演者は多めの発注を。`);
    if(ord>0&&unsold/ord>0.35)L.push(`<b>在庫が余った：</b>発注の${Math.round(unsold/ord*100)}%が売れ残り。来場見込み×購入率で発注数を考えましょう。`);
  }
  const diff=R.altPay-R.artistPay;
  L.push(`<b>契約の振り返り：</b>${p.deal==='fixed'?'固定ギャラ':'歩合制'}で出演料は${fmtY(R.artistPay)}。もし${p.deal==='fixed'?'歩合制':'固定ギャラ'}だったら${fmtY(R.altPay)}で、${diff>0?`<span class="good">今回の選択で${fmtY(diff)}得</span>`:diff<0?`<span class="bad">${fmtY(-diff)}多く払っていた</span>ことになります`:'同じ'}${diff>0?'しました':''}。`);
  if(R.invPayout)L.push(`<b>共同主催：</b>出資者に${fmtY(R.invPayout)}を返しました（出資${fmtY(p.investAmt)}＋${R.invShare>=0?'利益':'損失'}の40%）。リスクを分け合った分、利益も分け合います。`);
  if(R.refund)L.push(`<b>スポンサー条件未達：</b>稼働率70%に届かず、協賛金の半額${fmtY(R.refund)}を返金しました。`);
  return L;
}

  const R=S.result,p=S.plan,a=A(p.artist),v=Vn(p.venue);
  const tr=(l,n,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="v">${n}</td></tr>`;
  const inc=[['チケット売上（前売 '+fmtN(R.presold)+'枚＋当日 '+fmtN(R.walk)+'枚）',R.ticketRev],['グッズ売上',R.merchRev],['売れ残りグッズの後日回収',R.salvage],['協賛金',R.sponsor-R.refund],['クラウドファンディング',R.crowd],['臨時収入（イベント）',R.eventIncome]].filter(x=>x[1]);
  const exp=[['出演料'+(p.deal==='share'?'（歩合45%）':''),R.artistPay],['会場費',R.rent],['制作・演出費',R.prod],['宣伝費',R.promo],['グッズ原価',R.merchCost],['運営・警備人件費',R.staff],['プレイガイド手数料（前売の8%）',R.playguide],['クラファンのお礼費用',R.gift],['臨時の出費（イベント）',R.eventCost],['借入の利息（5%）',R.interest]].filter(x=>x[1]);
  const last=S.showNo>=MAX_SHOWS,broke=S.cash<0;
  return `<div class="eyebrow">第${S.showNo}公演 ／ 収支報告</div>
  <h2 style="margin:6px 0 14px">${esc(a.name)} ＠ ${esc(v.name)}</h2>
  <div class="kpis">
    <div class="kpi"><small>最終損益</small><b class="${R.net>=0?'good':'bad'}">${R.net>=0?'+':''}${fmtY(R.net)}</b></div>
    <div class="kpi"><small>動員 ／ 稼働率</small><b>${fmtN(R.sold)}人 ／ ${Math.round(R.fill*100)}%</b></div>
    <div class="kpi"><small>満足度</small><b>${R.sat}</b></div>
    <div class="kpi"><small>損益分岐点（宣伝費別）</small><b>${R.be===Infinity?'—':fmtN(R.be)+'枚'}</b></div>
    <div class="kpi"><small>信頼度</small><b>${Math.round(R.repBefore)} → ${Math.round(S.rep)} <span class="${R.dRep>=0?'good':'bad'}" style="font-size:15px">(${R.dRep>=0?'+':''}${R.dRep})</span></b></div>
  </div>
  <div class="two" style="margin-top:18px">
    <div class="panel"><h3>損益計算書</h3>
      <table class="pl">
        <tr class="h"><td colspan="2">収入</td></tr>${inc.map(x=>tr(x[0],fmtY(x[1]))).join('')}
        <tr class="h"><td colspan="2">支出</td></tr>${exp.map(x=>tr(x[0],'−'+fmtY(x[1]))).join('')}
        ${R.invPayout?`<tr class="h"><td colspan="2">共同主催</td></tr>${tr('出資者への分配（利益の40%）',(R.invShare>=0?'−':'+')+fmtY(Math.abs(R.invShare)))}`:''}
        ${tr('この公演の最終損益',`<span class="${R.net>=0?'good':'bad'}">${R.net>=0?'+':''}${fmtY(R.net)}</span>`,'sum')}
      </table>
      ${R.merch.some(m=>m.q)?`<h3 style="margin-top:18px">グッズの結果</h3><table class="pl">${R.merch.filter(m=>m.q||m.dem).map(m=>tr(m.name,`${fmtN(m.sold)} / ${fmtN(m.q)}個 ${m.lost?'<span class="bad">品切れ</span>':m.unsold?'<span class="muted">残'+fmtN(m.unsold)+'</span>':'<span class="good">完売</span>'}`)).join('')}</table>`:''}
    </div>
    <div class="stack">
      <div class="panel"><h3>プロデューサーの振り返り</h3><div class="lessons" style="margin-top:10px">${lessons(R).map(l=>`<div class="tip">${l}</div>`).join('')}</div></div>
      ${broke?`<div class="panel" style="border-color:var(--bad)"><h3 class="bad">資金がマイナスになりました</h3><p class="lead" style="margin-top:6px">支払いができず、会社は倒産してしまいました…。</p></div>`:''}
      <button class="btn primary big" onclick="${broke||last?'goEnd()':'nextShow()'}">${broke?'結果を見る':last?'最終結果へ':'次の公演を企画する'}</button>
    </div>
  </div>`;
}
function nextShow(){
  S.absWeek+=S.camp.K+2;S.showNo++;startPlanning();scrollTo(0,0);
}
function goEnd(){S.phase='end';render();scrollTo(0,0);}
function endHTML(){
  const broke=S.cash<0;

  else if(S.cash>=20000000){rank='B';title='敏腕プロモーター';}

  else {rank='D';title='修行中のイベンター';}
  return `<section style="text-align:center;padding-block:20px" class="stack">
    <div class="eyebrow">FINAL RESULT</div>
    <div class="rank">${rank}</div>
    <h2>${title}</h2>
    <p class="lead" style="margin:0 auto">最終資金 <b class="num">${fmtY(S.cash)}</b>（スタート時 300万円）／ 通算損益 <b class="num ${tot>=0?'good':'bad'}">${tot>=0?'+':''}${fmtY(tot)}</b> ／ 信頼度 <b class="num">${Math.round(S.rep)}</b></p>
  </section>
  <div class="panel" style="margin-top:10px"><h3>公演の記録</h3>
   <div style="overflow-x:auto;margin-top:8px"><table class="hist"><thead><tr><th>#</th><th>演者</th><th>会場</th><th>価格</th><th>動員</th><th>稼働率</th><th>満足度</th><th>損益</th></tr></thead>
   <tbody>${S.history.map(h=>`<tr><td>${h.no}</td><td>${esc(h.artist)}</td><td>${esc(h.venue)}</td><td class="v">${fmtN(h.price)}円</td><td class="v">${fmtN(h.sold)}/${fmtN(h.cap)}</td><td class="v">${Math.round(h.fill*100)}%</td><td class="v">${h.sat}</td><td class="v ${h.net>=0?'good':'bad'}">${h.net>=0?'+':''}${fmtY(h.net)}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="tip" style="margin-top:14px"><b>ランクの目安：</b>最終資金 600万円でC、2,000万円でB、8,000万円でA、2億円でS。ドーム公演を成功させるには、借入・出資・スポンサーを組み合わせた資金調達が欠かせません。</div>
  <div class="row" style="margin-top:16px;justify-content:center"><button class="btn primary big" onclick="clearSave();newGame()">もう一度プレイ</button></div>`;
}

/* ========== 図：客席と販売グラフ ========== */
const seatCache={};
function seatLayout(n){
  if(seatCache[n])return seatCache[n];
  const cx=210,cy=16,a0=35*Math.PI/180,a1=145*Math.PI/180,rows=[];
  for(let r=62;r<=258;r+=14)rows.push(r);
  const totalLen=rows.reduce((s,r)=>s+r*(a1-a0),0);const sp=totalLen/n;
  const pts=[];
  rows.forEach((r,ri)=>{const cnt=Math.max(1,Math.round(r*(a1-a0)/sp));for(let i=0;i<cnt;i++){const t=a0+(a1-a0)*(i+0.5)/cnt;pts.push({x:cx+r*Math.cos(t),y:cy+r*Math.sin(t),ri,c:Math.abs(t-Math.PI/2)});}});
  pts.sort((p,q)=>p.ri-q.ri||p.c-q.c);
  return seatCache[n]={pts,rad:clamp(sp*0.36,1.6,6)};
}
function seatSVG(cap,sold,live,a){
  const n=Math.min(cap,420);const L=seatLayout(n);const on=Math.round(L.pts.length*sold/cap);
  const cols=['#e9b64f','#ff6fa3','#7cc7ff','#b98cff','#fff2d2'];
  const dots=L.pts.map((p,i)=>{
    if(i<on){
      const col=live?cols[i%5]:'var(--seat-on)';
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${L.rad.toFixed(2)}" fill="${col}" ${live?`class="seat-live" style="animation-delay:${(i%17)*0.09}s"`:''}/>`;
    }
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${L.rad.toFixed(2)}" fill="var(--seat-off)"/>`;
  }).join('');
  const ppl=cap>n?`<text x="410" y="282" text-anchor="end" font-size="10" fill="var(--faint)">● 1つ ≈ ${fmtN(cap/n)}席</text>`:'';
  return `<svg viewBox="0 0 420 288" role="img" aria-label="客席図：${fmtN(sold)} / ${fmtN(cap)}席">
   <defs><linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d68c"/><stop offset="1" stop-color="#8a6727"/></linearGradient>
   <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="rgba(255,242,210,${live?0.35:0.12})"/><stop offset="1" stop-color="rgba(255,242,210,0)"/></radialGradient></defs>
   <rect x="0" y="0" width="420" height="288" fill="url(#glow)"/>
   <path d="M150 2 H270 L262 34 H158 Z" fill="url(#stg)"/>
   <text x="210" y="24" text-anchor="middle" font-size="11" fill="#2a1606" font-weight="700" letter-spacing="4">STAGE</text>
   ${live&&a?`<text x="210" y="50" text-anchor="middle" font-size="12" fill="var(--spot)" font-weight="700">${esc(a.name)}</text>`:''}
   ${dots}${ppl}</svg>`;
}
function chartSVG(){
  const C=S.camp,v=Vn(S.plan.venue),K=C.K;
  const W=420,H=170,pl=40,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  let cum=0;const cums=C.weekly.map(x=>cum+=x);
  const maxY=Math.max(v.cap,1);
  const bw=iw/K;
  const y=val=>pt+ih-(val/maxY)*ih;
  const maxBar=Math.max(1,...C.weekly);
  const yb=val=>pt+ih-(val/maxY)*ih;
  let bars=C.weekly.map((n,i)=>`<rect x="${(pl+i*bw+bw*0.18).toFixed(1)}" y="${yb(n).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${(pt+ih-yb(n)).toFixed(1)}" rx="2" fill="var(--curtain)"/>`).join('');
  let line=cums.length?`<polyline fill="none" stroke="var(--brass)" stroke-width="2" points="${cums.map((c,i)=>`${(pl+(i+0.5)*bw).toFixed(1)},${y(c).toFixed(1)}`).join(' ')}"/>`+cums.map((c,i)=>`<circle cx="${(pl+(i+0.5)*bw).toFixed(1)}" cy="${y(c).toFixed(1)}" r="${i===cums.length-1?4:2.5}" fill="var(--brass)"/>`).join(''):'';
  const ticks=[0,0.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(maxY*f)}" y2="${y(maxY*f)}" stroke="var(--line)" stroke-width="1" ${f===1?'stroke-dasharray="4 3"':''}/><text x="${pl-6}" y="${y(maxY*f)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${fmtN(maxY*f)}</text>`).join('');
  const xl=Array.from({length:K},(_,i)=>(K<=8||i%2===0)?`<text x="${(pl+(i+0.5)*bw).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mute)">${i+1}週</text>`:'').join('');
  const empty=!C.weekly.length?`<text x="${pl+iw/2}" y="${pt+ih/2}" text-anchor="middle" font-size="12" fill="var(--faint)">発売するとここにグラフが出ます</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="週ごとの販売枚数">${ticks}${bars}${line}${xl}${empty}
   <text x="${W-pr}" y="${pt-2}" text-anchor="end" font-size="10" fill="var(--mute)">点線＝キャパ　━ 累計　■ その週</text></svg>`;
}

/* ========== モーダル ========== */
function showModal(html,wide){$('#modal-root').innerHTML=`<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal ${wide?'wide':''}">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
function closeInfo(){closeModal();if(S)runQueue();}
function term(name){
  const g=GLOSSARY.find(x=>x[0]===name);if(!g)return;
  const prev=$('#modal-root').innerHTML;
  if(prev){ // 既存のモーダル上では、下に小さく出す
    const box=document.createElement('div');box.className='tip';box.style.marginTop='12px';box.innerHTML=`<b>${g[0]}：</b>${g[1]}`;$('.modal').appendChild(box);return;
  }
  showModal(`<div class="eyebrow">用語手帳</div><h3>${g[0]}</h3><p class="lead">${g[1]}</p><div class="row" style="margin-top:16px"><button class="btn primary" onclick="closeInfo()">閉じる</button></div>`);
}
function openGlossary(){
  showModal(`<div class="eyebrow">プロモーターの用語手帳</div><h3>知っておきたい業界用語</h3><dl class="gl">${GLOSSARY.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl><div class="row" style="margin-top:16px"><button class="btn primary" onclick="closeInfo()">閉じる</button></div>`,true);
}
function openHowTo(){
  showModal(`<div class="eyebrow">遊び方</div><h3>プロモーターの仕事の流れ</h3>
  <div class="stack" style="margin-top:8px">
   <div class="tip"><b>1. 演者を選ぶ：</b>動員力・出演料・物販人気を比べて、誰の公演を打つか決める。</div>
   <div class="tip"><b>2. 会場と日程を押さえる：</b>キャパが動員力に見合う会場を選び、演者と会場の両方が空いている日を探す。</div>
   <div class="tip"><b>3. 契約とチケット：</b>固定ギャラか歩合か、チケット価格、演出の豪華さを決める。損益分岐点に注目。</div>
   <div class="tip"><b>4. 資金を集める：</b>前払い費用が足りなければ、借入・スポンサー・共同主催・クラファンで調達。</div>
   <div class="tip"><b>5. 宣伝してチケットを売る：</b>毎週3回まで宣伝できる。演者のファン層に合った媒体を選ぶのがコツ。突発的なトラブルにも対応しよう。</div>
   <div class="tip"><b>6. グッズを発注する：</b>公演3週前が締め切り。作りすぎも作らなさすぎも損。</div>
   <div class="tip"><b>7. 公演と精算：</b>損益計算書で何が良くて何が悪かったかを振り返る。満員なら信頼度が上がり、大物の演者や大きな会場と組めるようになる。</div>
  </div>
  <p class="lead" style="margin-top:12px">全${MAX_SHOWS}公演で、最終的な資金の大きさがランクになります。資金がマイナスになると倒産です。</p>
  <div class="row" style="margin-top:16px"><button class="btn primary" onclick="closeInfo()">わかった</button></div>`,true);
}
function openMenu(){
  showModal(`<h3>メニュー</h3><div class="stack" style="margin-top:10px">
   <button class="choice" onclick="closeModal();openHowTo()"><b>遊び方</b><span>仕事の流れとルール</span></button>
   <button class="choice" onclick="closeModal();S=null;render()"><b>タイトルに戻る</b><span>進行状況は自動でセーブされています</span></button>
   <button class="choice" onclick="closeInfo()"><b>閉じる</b></button></div>`);
}

/* ========== 起動 ========== */
function start(data){
  if(data&&data.S){S=data.S;}
  render();
  if(S&&S.phase==='camp'&&S.camp&&S.camp.K-S.camp.week<=3&&!S.camp.merchDone){modalQ.push(merchModal);runQueue();}
}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
